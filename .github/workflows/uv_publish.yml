# Builds the package and uploads it to PyPI when a GitHub release is published.
# Uses PyPI trusted publishing (OIDC), so no API token is stored in the repository:
# https://docs.pypi.org/trusted-publishers/

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest
    # Must match the environment named in the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/ymprint/
    permissions:
      # Lets the job request the OIDC token that PyPI exchanges for an upload token.
      id-token: write

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Build package
      run: uv build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
