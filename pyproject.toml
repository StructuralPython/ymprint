[project]
name = "ymprint"
dynamic = ["version", "description"]
readme = "README.md"
authors = [
    { name = "Connor Ferster", email = "connor@structuralpython.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "platformdirs>=4.13.5",
    "pydantic>=2.13.4",
    "pygments>=2.20.0",
    "pymupdf>=1.27.2.3",
    "pypdf>=6.14.0",
    "reportlab>=4.5.1",
    "ruamel-yaml>=0.19.1",
    "typer>=0.26.7",
    "wenmode>=0.8.0",
]

[project.optional-dependencies]
# The _hc block (handcalcs calculations); see docs/installation.md.
hc = ["ym-handcalcs>=0.2.1"]

[project.scripts]
ym = "ymprint.cli.main:app"

[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "ymprint"

[dependency-groups]
dev = [
    # Named here so uv accepts the handcalcs pre-release ym-handcalcs needs.
    "handcalcs>=2.0.0rc2",
    "matplotlib>=3.11.0",
    "pytest>=9.0.3",
    "rich>=15.0.0",
    "ym-handcalcs>=0.2.1",
]
