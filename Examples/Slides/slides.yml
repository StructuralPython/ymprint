# A 1080p (1920 x 1080 pt) slide deck that shows off YMPrint's blocks inside slides.
#
# The vector backgrounds in backgrounds/ are generated by make_backgrounds.py:
#   uv run python make_backgrounds.py
# Render the deck with:
#   ym convert slides.yml
_vars:
  title: YMPrint Slides
  author: Connor Ferster  ·  Structural Python
  year: 2000

_doc:
  page-size: [1920, 1080]     # 1 pt = 1 px on a 1080p display
  slides: true
  templates:
    hero:                     # listed first: the deck's first slide always uses it
      margins: &margins {top: 90, left: 120, right: 120, bottom: 110}
      background: {filepath: backgrounds/hero.pdf, relative-to: source}
    content:
      margins: *margins
      background: {filepath: backgrounds/content.pdf, relative-to: source}
    section:
      margins: *margins
      background: {filepath: backgrounds/section.pdf, relative-to: source}
    closing:
      margins: *margins
      background: {filepath: backgrounds/closing.pdf, relative-to: source}
  # Frames are [x, y, width, height] inside the 1680 x 880 content box.
  # Values <= 1 are fractions of the box, values > 1 are points.
  layouts:
    default:
      title: {box: [0, 0, 1, 150], valign: bottom}
      body: [0, 190, 1, 690]
    two-column:
      title: {box: [0, 0, 1, 150], valign: bottom}
      left: [0, 190, 0.47, 690]
      right: [0.53, 190, 0.47, 690]
    code-right:
      title: {box: [0, 0, 1, 150], valign: bottom}
      text: [0, 190, 0.36, 690]
      code: [0.40, 190, 0.60, 690]
    figure-right:
      title: {box: [0, 0, 1, 150], valign: bottom}
      text: [0, 190, 0.34, 690]
      figure: {box: [0.37, 165, 0.63, 715], valign: middle}
    hero:
      title: {box: [0, 0.10, 0.58, 0.48], valign: bottom}
      body: [0, 0.62, 0.58, 0.26]
    closing:
      title: {box: [0.1, 0.02, 0.8, 0.30], valign: bottom}
      body: [0.1, 0.34, 0.8, 0.14]

_style:
  headings:
    font: Montserrat
    color: "#1b1446"
    ratio: minor third         # h1 = 38 × 1.2⁵ ≈ 95 pt
  body:
    font: Inter
    size: 38
    color: "#2e2856"
    spacing: 1.4
    bullets:
      font: DejaVuSans
      size: 30
      color: "#e0218a"
      symbols: "▸▹•◦"
      spacing: 14
      indent-bullet: 4
      indent-text: 52
  styles:
    hero:                      # light text for the dark synthwave slides
      body:
        size: 40
        color: "#d9d4ff"
        bullets: {color: "#22e4ff"}
      headings:
        color: "#ffffff"
        ratio: major third
    closing:
      body:
        size: 40
        color: "#d9d4ff"
        align: center
      headings:
        color: "#ffffff"
        ratio: major third
        align: center
    small:
      body:
        size: 32
        bullets: {size: 26}
    callout:
      body:
        font: Montserrat
        size: 46
        color: "#e0218a"
        align: center

_tablestyle:
  cell-padding: {top: 14, left: 28, right: 28, bottom: 14}
  headers:
    text: {font: Montserrat, size: 30, color: "#ffffff", bold: true}
    row: {color: "#1b1446", lines: []}
  body:
    text: {font: Inter, size: 30, color: "#1b1446"}
    rows:
      color: {even: "#ffffff", odd: "#eceafa"}
      lines: []


# ---------------------------------------------------------------------------

"**YMPrint** <font color='#22e4ff'>Slides</font>":
  - _slide: {layout: hero, template: hero}
  - _textstyle: hero
  - Desktop publishing with YAML, now in 16:9.
  - "<font size='26' color='#ff8ad8'>{{author}}</font>"

A deck is just a YAML file:
  - _slide: {layout: code-right, template: content}
  - _textstyle: small
  - _ul:
    - Every top-level heading is **one slide**
    - Frames place content side by side
    - Backgrounds are ordinary PDFs, drawn in anything
    - Renders to a crisp **vector** PDF
  - _frame: code
  - _code:
      width_ratio: 1
      caption: slides.yml — this very slide
      source: |
        A deck is just a YAML file:
          - _slide:
              layout: code-right
              template: content
          - _textstyle: small
          - _ul:
            - Every top-level heading is **one slide**
            - Frames place content side by side
            - Backgrounds are ordinary PDFs, ...
            - Renders to a crisp **vector** PDF
          - _frame: code
          - _code:
              caption: slides.yml — this very slide
              source: ...

"<font color='#22e4ff'>01</font> Layouts & frames":
  - _slide: {layout: hero, template: section}
  - _textstyle: hero
  - Put anything anywhere, as long as it is a rectangle.

Layouts are named rectangles:
  - _slide: {layout: two-column, template: content}
  - _textstyle: small
  - Define a layout once under `_doc`, then pick it per slide with `_slide`.
  - Each frame is `[x, y, width, height]`, measured from the top-left of the content box.
  - Send content to a frame with `_frame`, and it sizes itself to fit.
  - _frame: right
  - _code:
      width_ratio: 1
      caption: _doc → layouts
      source: |
        layouts:
          two-column:
            title: {box: [0, 0, 1, 150],
                    valign: bottom}
            left:  [0,    190, 0.47, 690]
            right: [0.53, 190, 0.47, 690]

Images drop into any frame:
  - _slide: {layout: figure-right, template: content}
  - _textstyle: small
  - "Our logo, faithfully preserved at full **year {{year}}** fidelity."
  - _spacer: 20
  - "An `_img` with `width_ratio: 1` fills its frame. A frame with `valign: middle` centres it."
  - _frame: figure
  - _img:
      source: ../../ymprintlogolarge.png
      width_ratio: 1.6     # small images are scaled up
      caption: "Figure 1: Desktop publishing, circa 2000"

"<font color='#22e4ff'>02</font> Code that runs":
  - _slide: {layout: hero, template: section}
  - _textstyle: hero
  - Python executes while the PDF renders. The results land on the slide.

"Run it, then show it: `_py`":
  - _slide: {layout: two-column, template: content}
  - _py:
      namespace: beam
      width_ratio: 1
      line_numbers: true
      caption: Executed during ym convert
      source: |
        w = 12.0      # kN/m, uniform load
        L = 8.0       # m, span
        E = 200e6     # kN/m², steel
        I = 3.0e-4    # m⁴
        M_max = w * L**2 / 8
        V_max = w * L / 2
        delta = 5*w*L**4 / (384*E*I) * 1000
        limit = L * 1000 / 360
        ok = delta < limit
  - _frame: right
  - _textstyle: small
  - "The variables flow straight into a table with `{{ '{{ beam.M_max }}' }}`:"
  - _spacer: 10
  - - Quantity: Max. moment
      Value: "{{ '%.1f' | format(beam.M_max) }} kN·m"
    - Quantity: Max. shear
      Value: "{{ '%.1f' | format(beam.V_max) }} kN"
    - Quantity: Deflection
      Value: "{{ '%.1f' | format(beam.delta) }} mm"
    - Quantity: Limit (L/360)
      Value: "{{ '%.1f' | format(beam.limit) }} mm"
    - Quantity: Check
      Value: "{{ 'PASS' if beam.ok else 'FAIL' }}"

"Plots from live objects: `_matplotfig`":
  - _slide: {layout: figure-right, template: content}
  - _py:
      echo: false
      source: |
        import numpy as np
        import matplotlib
        matplotlib.use("Agg")
        import matplotlib.pyplot as plt

        x = np.linspace(0, beam["L"], 200)
        M = beam["w"] * x * (beam["L"] - x) / 2
        V = beam["w"] * (beam["L"] / 2 - x)

        ink, magenta, cyan = "#1b1446", "#e0218a", "#0fb5d4"
        plt.rcParams.update({"font.size": 15, "text.color": ink, "axes.labelcolor": ink,
                             "xtick.color": ink, "ytick.color": ink, "axes.edgecolor": ink})
        bmd_fig, (ax_m, ax_v) = plt.subplots(2, 1, figsize=(10, 6.8), sharex=True)
        ax_m.fill_between(x, M, color=magenta, alpha=0.18)
        ax_m.plot(x, M, color=magenta, lw=3)
        ax_m.invert_yaxis()
        ax_m.set_ylabel("Moment (kN·m)")
        ax_v.fill_between(x, V, color=cyan, alpha=0.18)
        ax_v.plot(x, V, color=cyan, lw=3)
        ax_v.set_ylabel("Shear (kN)")
        ax_v.set_xlabel("Position along span (m)")
        for ax in (ax_m, ax_v):
            ax.axhline(0, color=ink, lw=1)
            ax.spines[["top", "right"]].set_visible(False)
            ax.grid(alpha=0.25)
        bmd_fig.tight_layout()
  - _textstyle: small
  - A hidden `_py` block builds a matplotlib figure from the beam on the last slide.
  - _spacer: 16
  - "`$bmd_fig` hands the live object to the block:"
  - _code:
      width_ratio: 1
      source: |
        _matplotfig:
          fig: $bmd_fig
          scale_ratio: 1
  - _frame: figure
  - _matplotfig:
      fig: $bmd_fig
      scale_ratio: 1

"<font color='#22e4ff'>03</font> Words, lists & tables":
  - _slide: {layout: hero, template: section}
  - _textstyle: hero
  - Everything a document can do, a slide can do.

Inline markup & variables:
  - _slide: {layout: code-right, template: content}
  - _textstyle: small
  - Write **bold**, *italic* and `inline code` in plain YAML strings.
  - "Variables interpolate anywhere: this deck honours the year {{year}}."
  - "ReportLab markup passes through, for <font color='#e0218a'>colour</font> and <font size='44'>size</font>."
  - _spacer: 30
  - _p:
      style: callout
      content: "_p picks a named style: this is “callout”."
  - _frame: code
  - _code:
      width_ratio: 1
      caption: The source of the text on the left
      source: |
        - Write **bold**, *italic* and `inline code`
          in plain YAML strings.
        - "Variables interpolate anywhere: this deck
          honours the year {{year}}."
        - "ReportLab markup passes through, for
          <font color='#e0218a'>colour</font> and
          <font size='44'>size</font>."
        - _p:
            style: callout
            content: "_p picks a named style: ..."

Callouts scale with your text:
  - _slide: {layout: two-column, template: content}
  - _tip: Admonitions, quotes and captions size themselves from the body text, so they read on a 1080p slide.
  - _warning: This deck has a 38 pt body, so these callouts are drawn 3.8 times their size in a 10 pt report.
  - _frame: right
  - _note: Five kinds are available — _info, _warning, _danger, _tip and _note.
  - _blockquote:
      quote: “What you do makes a difference, and you have to decide what kind of difference you want to make.”
      attribution: Jane Goodall

Lists, ordered and not:
  - _slide: {layout: two-column, template: content}
  - _ul:
    - Gathering information
    - - Site visits
      - Drawings and specs
    - Simulation
    - - Hand calcs
      - Finite element models
    - Reporting
  - _frame: right
  - _ol:
    - Write YAML
    - Run `ym convert`
    - Present
    - - Full screen
      - Any PDF viewer

Tables are lists of mappings:
  - _slide: {layout: code-right, template: content}
  - _textstyle: small
  - Every mapping is a row, and its keys are the column headers.
  - _spacer: 20
  - "Header and row colours come from `_tablestyle`."
